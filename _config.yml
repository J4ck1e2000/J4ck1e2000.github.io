# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Haokun Ren"
description              : "Research on EEG/MEG neural representations and brain-to-image retrieval."
url                      : "https://j4ck1e2000.github.io"
repository               : "J4ck1e2000/J4ck1e2000.github.io"
google_scholar_stats_use_cdn: true
google_scholar_stats_enabled: false
google_analytics_id: ""

# Site Author
author:
  name:
    zh: "任豪坤"
    en: "Haokun Ren"
  location:
    zh: "中国重庆"
    en: "Chongqing, China"
  github: "J4ck1e2000"
  bio:
    zh: "我关注 EEG/MEG 神经信号如何与视觉表征对齐，以及这种对齐如何支持脑到图像检索。"
    en: "I study how EEG/MEG signals align with visual representations, and how this alignment can support brain-to-image retrieval."


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - AGENTS.md
  - google_scholar_crawler
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - LICENSE
  - README.md
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Asia/Shanghai # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
