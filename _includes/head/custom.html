<style>
  :root {
    --ant-bg: #F4F1EA;
    --ant-surface: #FBFAF6;
    --ant-ink: #1A1915;
    --ant-ink-soft: #57544C;
    --ant-clay: #CC785C;
    --ant-clay-deep: #B05E42;
    --ant-line: #E3DDD0;
    --ant-serif: "Newsreader", Georgia, "Songti SC", serif;
    --ant-sans: "Hanken Grotesk", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body {
    background-color: var(--ant-bg) !important;
    color: var(--ant-ink) !important;
    font-family: var(--ant-sans) !important;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.01em;
  }
  /* 背景铺满：html、内容容器、侧边栏都统一成米白 */
  html { background-color: var(--ant-bg) !important; }
  .initial-content, .page, .page__inner-wrap, #main,
  .author__avatar, .sidebar, .author__urls-wrapper { background-color: transparent !important; }
  .sidebar .author__urls, .author__urls.social-icons { background-color: transparent !important; box-shadow: none !important; border-color: var(--ant-line) !important; }
  #main, .page__content, .archive { color: var(--ant-ink) !important; }
  h1, h2, h3, h4, .page__title, .archive__item-title {
    font-family: var(--ant-serif) !important;
    font-weight: 500 !important;
    letter-spacing: -0.01em !important;
    color: var(--ant-ink) !important;
  }
  .page__content h1, .page__content h2 {
    border-bottom: 1px solid var(--ant-line);
    padding-bottom: 0.3em;
    margin-top: 1.8em;
  }

  /* 链接 */
  a, .page__content a { color: var(--ant-clay-deep) !important; text-decoration: none; }
  a:hover, .page__content a:hover { color: var(--ant-clay) !important; text-decoration: underline; text-underline-offset: 3px; }

  /* 顶部导航栏 */
  .masthead { background: var(--ant-bg) !important; border-bottom: 1px solid var(--ant-line) !important; box-shadow: none !important; }
  .greedy-nav { background: transparent !important; }
  .greedy-nav a { color: var(--ant-ink-soft) !important; font-family: var(--ant-sans) !important; }
  .greedy-nav a:hover { color: var(--ant-clay-deep) !important; }
  .greedy-nav .visible-links a:before { background: var(--ant-clay) !important; height: 2px; }
  .masthead__menu-item--lg a { font-family: var(--ant-serif) !important; font-size: 1.1em; }

  /* 侧边栏头像与作者信息 */
  .author__avatar img {
    border-radius: 50% !important;
    border: 3px solid var(--ant-clay) !important;
    box-shadow: 0 6px 22px rgba(176,94,66,0.18);
    max-width: 180px;
  }
  .author__name { font-family: var(--ant-serif) !important; color: var(--ant-ink) !important; }
  .author__bio, .author__urls li { color: var(--ant-ink-soft) !important; font-family: var(--ant-sans) !important; }
  .author__urls a { color: var(--ant-ink-soft) !important; }
  .author__urls a:hover { color: var(--ant-clay-deep) !important; }
  .author__urls .icon, .author__urls i { color: var(--ant-clay) !important; }

  /* 论文卡片 */
  .paper-box {
    background: var(--ant-surface) !important;
    border: 1px solid var(--ant-line) !important;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 2px 10px rgba(26,25,21,0.04);
    transition: box-shadow .25s, transform .25s;
  }
  .paper-box:hover { box-shadow: 0 8px 26px rgba(176,94,66,0.12); transform: translateY(-2px); }
  .badge { background: var(--ant-clay) !important; color: #fff !important; font-family: var(--ant-sans) !important; border-radius: 5px; }

  /* 引用块 */
  blockquote {
    border-left: 3px solid var(--ant-clay) !important;
    background: var(--ant-surface);
    color: var(--ant-ink-soft) !important;
    font-style: italic;
  }

  /* 列表中的斜体时间,用衬线呼应品牌 */
  .page__content li em, .page__content li i { font-family: var(--ant-serif) !important; color: var(--ant-clay-deep); font-style: italic; }

  /* 页脚 */
  .page__footer { background: var(--ant-bg) !important; border-top: 1px solid var(--ant-line); color: var(--ant-ink-soft) !important; }
  .page__footer a { color: var(--ant-ink-soft) !important; }
  .page__footer-follow .social-icons i { color: var(--ant-clay) !important; }
</style>

<!-- end custom head snippets -->
