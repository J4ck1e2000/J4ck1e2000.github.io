<section class="hero" aria-labelledby="hero-title">
  <div class="hero__copy">
    <p class="hero__eyebrow">{% if page.locale == 'zh' %}研究者 / 脑与视觉表征{% else %}RESEARCHER / BRAIN &amp; VISION{% endif %}</p>
    <h1 id="hero-title">{{ page.hero_title | escape }}</h1>
    <p class="hero__summary">{{ page.hero_summary | escape }}</p>
  </div>
  <div class="hero__visual">
    <img src="{{ '/images/brain-vision-mark.svg' | relative_url }}" alt="" aria-hidden="true">
    <p class="hero__visual-label">EEG <span aria-hidden="true">→</span> VISION</p>
  </div>
</section>
